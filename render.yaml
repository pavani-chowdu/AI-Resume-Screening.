services:
  - type: web
    name: smarthire-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        value: sqlite:////var/data/smarthire.db
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
